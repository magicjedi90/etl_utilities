[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etl_utilities"
dynamic = ["version"]
description = 'An ETL framework for data cleaning, type inference, SQL generation, and database loading across Pandas, Polars, and Spark DataFrames and MSSQL, MySQL/MariaDB, and PostgreSQL backends.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["etl", "pandas", "polars", "spark", "cleaning", "etl-utilities", "utilities", "database", "dataframe", "parquet"]
authors = [
    { name = "Jesse", email = "magicjedi90@aim.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "numpy",
    "pandas",
    "python_dateutil",
    "SQLAlchemy",
    "rich",
]

[project.optional-dependencies]
polars = ["polars"]
spark = ["pyspark"]
postgres = ["psycopg2-binary"]
arrow = ["pyarrow"]
all = ["polars", "pyspark", "psycopg2-binary", "pyarrow"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "polars",
    "pyspark",
    "psycopg2-binary",
    "pyarrow",
]

[project.urls]
Documentation = "https://github.com/magicjedi90/etl_utilities#readme"
Issues = "https://github.com/magicjedi90/etl_utilities/issues"
Source = "https://github.com/magicjedi90/etl_utilities"

[tool.hatch.version]
path = "src/etl/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]
[tool.hatch.envs.types]
features = ["all"]
extra-dependencies = [
    "mypy>=1.0.0",
    "pytest>=8.3.5",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive --explicit-package-bases {args:src/etl tests}"

[tool.coverage.run]
source_pkgs = ["etl", "tests"]
branch = true
parallel = true
omit = [
    "src/etl/__about__.py",
]

[tool.coverage.paths]
etl = ["src/etl", "*/etl/src/etl"]
tests = ["tests", "*/etl/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
